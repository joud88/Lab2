<!DOCTYPE html>
<html>
<head>
    <title>{{ title }}</title>
</head>
<body>

{% if messages %}
    {% for message in messages %}
        <p>{{ message }}</p>
    {% endfor %}
{% endif %} 
<p>
    Logged in as: {{ request.user.username }}
    |
    <a href="/users/logout/">Logout</a>
</p>
<h1>{{ title }}</h1>

<form method="POST" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}

    <button type="submit">Save</button>
</form>

<br>
<a href="/courses/">Back to Courses</a>

</body>
</html>
